name: Keep-Alive Render Bot

on:
  schedule:
    # Runs every 10 minutes around the clock
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            URL="https://telegram-planner-bot.onrender.com"
          fi
          echo "Sending keep-alive ping to $URL..."
          curl -s -f -m 60 "$URL/health" || curl -s -m 60 "$URL" || true
          echo "Keep-alive ping sent successfully."
