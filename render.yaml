services:
  - type: web
    name: telegram-planner-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DAILY_BUDGET_LIMIT
        value: "70000"
      - key: TIMEZONE
        value: "Asia/Tashkent"
      - key: DATABASE_URL
        sync: false
